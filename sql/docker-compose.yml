version: '3.9'
services:
  db:
    image: postgres:15
    container_name: attendance_register_db
    environment:
      POSTGRES_DB: attendance_register
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build:
      context: ./backend
    container_name: attendance_register_backend
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/attendance_register
      JWT_SECRET_KEY: change_me_in_production
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
    depends_on:
      - db
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    container_name: attendance_register_frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  postgres_data:
